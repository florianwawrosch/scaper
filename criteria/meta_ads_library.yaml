# Filterkriterien fuer die Quelle "Meta Ads Library".
#
# Kernentscheidung (das einzige, was wirklich zaehlt): Ist es ein
# High-Ticket-Coach mit Setter-/Closer-Prinzip und Call-Funnel, UND ist er
# KEIN Konkurrent? Wenn ja -> potenzieller Kunde.
#
# Die exclusion_rules "konzerncoach" und "no_high_ticket" sind KEINE
# eigenstaendigen Ausschlussgruende, sondern nur Erkennungsmerkmale/
# Hilfsindikatoren dafuer, dass jemand eben KEIN High-Ticket-Coach ist (z.B.
# "viele Konzernfuzzis auf LinkedIn" -> Muster erkennen -> als Signal nutzen).
# "competitor" ist der einzige zusaetzliche, eigenstaendige Ausschlussgrund
# (Konkurrent = kein Kunde, unabhaengig vom Coaching-Modell).
#
# Neue Erkennungsmerkmale koennen hier jederzeit als neue Regel ergaenzt
# werden (id muss eindeutig sein), ohne Code zu aendern.

source: meta_ads_library
target_profile: >
  High-Ticket-Online-Coaches mit Setter-/Closer-Prinzip und einem
  Call-Funnel (z.B. kostenloses Erstgespraech, kostenlose Erstberatung oder
  kostenlose Analyse als Einstieg). Das ist die einzige harte Bedingung,
  zusammen mit "kein Konkurrent" (siehe Regel "competitor").

exclusion_rules:
  - id: competitor
    label: "Wettbewerber / Marketingagentur (harter Ausschluss)"
    description: >
      Andere Marketing-, Werbe- oder Funnel-Agenturen. Das sind Konkurrenten,
      keine potenziellen Kunden -- unabhaengig davon, ob sie High-Ticket
      arbeiten.
    active: true

  - id: konzerncoach
    label: "Signal: Konzerncoach / traditioneller Corporate Coach"
    description: >
      Hilfsindikator dafuer, dass jemand KEIN High-Ticket-Online-Coach ist:
      klassischer, alteingesessener Konzern- oder Firmentrainer (z.B.
      angestellte Trainer, klassische Weiterbildungsinstitute,
      Konzern-Vertriebstrainer ohne eigenes Coaching-Funnel-Modell).
    active: true

  - id: no_high_ticket
    label: "Signal: kein erkennbares High-Ticket-Angebot / kein Call-Funnel"
    description: >
      Hilfsindikator dafuer, dass jemand KEIN High-Ticket-Online-Coach ist:
      "normale"/guenstige Coaches/Berater ohne Hinweis auf hochpreisige
      Programme, Premium-Positionierung oder einen Call-Funnel
      (Erstgespraech/Erstberatung/Analyse).
    active: true

# Nischen-Priorisierung: Beziehungs-/Datingcoaches zuerst (dort schon
# Kundenerfolge), danach Fitness, danach Business. "sonstige" faengt alles
# andere auf, was trotzdem als High-Ticket-Coach durchgeht. Reihenfolge =
# Prioritaet, niedrigere Zahl = wichtiger.
niches:
  - id: beziehung_dating
    label: "Beziehungscoach / Datingcoach / Relationshipcoach"
    priority: 1
  - id: fitness
    label: "Fitnesscoach"
    priority: 2
  - id: business
    label: "Businesscoach"
    priority: 3
  - id: sonstige
    label: "Sonstige Nische"
    priority: 9

notes: []
